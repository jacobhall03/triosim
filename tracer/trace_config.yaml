# Models to profile (must be available in torchvision.models)
models:
  - vgg11
  - vgg13
  - vgg16
  - vgg19
  - resnet18
  - resnet34
  - resnet50
  - resnet101
  - resnet152
  - densenet121
  - densenet161
  - densenet169
  - densenet201

# Batch sizes to collect traces for
# RTX 4000 Ada (10.57 GiB): use 64 max; 128 will OOM on vgg16+ and densenet*
batch_sizes:
  - 32
  - 64

# Iteration settings
num_iters: 12       # Total training iterations per model
profile_start: 10   # Collect profiler+graph data for iterations after this index
warmup_start: 8     # Collect warmup timing for iterations after this index

# Paths (relative to the tracer/ directory)
dataset_path: ./ILSVRC2012_img_val
data_dir: ./data

# DataLoader workers
workers: 8

# Operators targeted for tensor parallelism (sets tpflag=1 in trace.csv)
target_ops:
  - aten::conv2d
  - aten::linear
  - aten::embedding
